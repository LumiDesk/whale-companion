name: Desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build portable package
        run: pnpm desktop:pack

      - name: Generate checksums
        shell: pwsh
        run: |
          $zip = Get-ChildItem apps/desktop/dist/whale-companion-*-win-x64.zip | Select-Object -First 1
          if (-not $zip) { throw "找不到便携包 zip" }

          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content -Path apps/desktop/dist/SHA256SUMS.txt -Encoding ascii
          Get-Content apps/desktop/dist/SHA256SUMS.txt

      - name: Show artifact
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/dist/*.zip | Select-Object Name, Length
          Get-FileHash apps/desktop/dist/*.zip -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whale-companion-win-x64
          path: |
            apps/desktop/dist/whale-companion-*-win-x64.zip
            apps/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = (Get-ChildItem apps/desktop/dist/whale-companion-*-win-x64.zip | Select-Object -First 1).FullName
          if (-not $zip) { throw "找不到便携包 zip" }

          $sums = Join-Path (Split-Path $zip) "SHA256SUMS.txt"
          if (-not (Test-Path $sums)) { throw "找不到 SHA256SUMS.txt" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sums --clobber
          } else {
            gh release create $tag $zip $sums --title "小鲸鱼 $tag" --generate-notes
          }
