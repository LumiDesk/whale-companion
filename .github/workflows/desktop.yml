name: Desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build portable package
        run: pnpm desktop:pack

      - name: Show artifact
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/dist/*.zip | Select-Object Name, Length
          Get-FileHash apps/desktop/dist/*.zip -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whale-companion-win-x64
          path: apps/desktop/dist/whale-companion-*-win-x64.zip
          if-no-files-found: error
          retention-days: 14
